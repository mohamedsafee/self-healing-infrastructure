server {
    listen 80;
    server_name localhost;

    location / {
        default_type text/plain;
        return 200 "Self-Healing Infrastructure is Running!";
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "NGINX HEALTHY";
    }

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}